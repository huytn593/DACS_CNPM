<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách yêu thích</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <header class="header py-3 mb-4" style="background:#fff; border-bottom:1px solid #eee;">
        <div class="container d-flex align-items-center justify-content-between">
            <a href="../index.html" class="navbar-brand d-flex align-items-center gap-2" style="color:#000;font-size:2rem;font-weight:bold;text-decoration:none;">
                <i class="bi bi-bag"></i> E-Commerce
            </a>
            <form id="search-form" class="d-flex align-items-center" style="gap:0.5rem;max-width:480px;flex:1;margin:0 2rem;">
                <label for="search-input"></label>
                <input type="text" id="search-input" class="form-control" placeholder="Tìm kiếm sản phẩm..." style="flex:1;">
                <button type="submit" class="btn btn-dark"><i class="bi bi-search"></i></button>
            </form>
            <div class="d-flex align-items-center gap-3">
                <a href="cart.html" class="position-relative" style="color:#000;font-size:1.5rem;">
                    <i class="bi bi-cart"></i>
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark" style="font-size: 0.8rem; display: none;">0</span>
                </a>
                <div id="auth-container"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mt-4">
        <h1 class="mb-4">Danh sách yêu thích</h1>
        <div id="wishlist-container">
            <!-- Wishlist items will be loaded here -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
