<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - E-Commerce Shop</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="header py-3 mb-4" style="background:#fff; border-bottom:1px solid #eee;">
        <div class="container d-flex align-items-center justify-content-between">
            <a href="../index.html" class="navbar-brand d-flex align-items-center gap-2" style="color:#000;font-size:2rem;font-weight:bold;text-decoration:none;">
                <i class="bi bi-bag"></i> E-Commerce
            </a>
            <form id="search-form" class="d-flex align-items-center" style="gap:0.5rem;max-width:480px;flex:1;margin:0 2rem;">
                <label for="search-input"></label>
                <input type="text" id="search-input" class="form-control" placeholder="Tìm kiếm sản phẩm..." style="flex:1;">
                <button type="submit" class="btn btn-dark"><i class="bi bi-search"></i></button>
            </form>
            <div class="d-flex align-items-center gap-3">
                <a href="cart.html" class="position-relative" style="color:#000;font-size:1.5rem;">
                    <i class="bi bi-cart"></i>
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark" style="font-size: 0.8rem; display: none;">0</span>
                </a>
                <div id="auth-container">
                    <div class="d-flex gap-2">
                        <a href="login.html" class="btn btn-outline-primary">Đăng nhập</a>
                        <a href="register.html" class="btn btn-primary">Đăng ký</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="auth-section">
            <h1>Đăng ký tài khoản</h1>
            <div id="register-error" class="alert alert-danger" style="display: none;"></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="full-name">Họ tên</label>
                    <input type="text" id="full-name" class="form-control" minlength="2" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" minlength="3" maxlength="50" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" minlength="6" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Xác nhận mật khẩu</label>
                    <input type="password" id="confirm-password" class="form-control" minlength="6" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="role">Đăng ký với vai trò</label>
                    <select id="role" class="form-control">
                        <option value="user">Người mua</option>
                        <option value="seller">Người bán</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-block">Đăng ký</button>
            </form>
            <div class="auth-links">
                <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Về chúng tôi</h3>
                    <p>E-Commerce Shop cung cấp nền tảng mua sắm trực tuyến tin cậy và tiện lợi.</p>
                </div>
                <div class="footer-section">
                    <h3>Liên hệ</h3>
                    <p>Email: contact@ecommerce.com</p>
                    <p>Điện thoại: (123) 456-7890</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 E-Commerce Shop. Tất cả quyền được bảo lưu.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
