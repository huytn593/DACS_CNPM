<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá sản phẩm - Seller</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,500,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background: #fff; color: #212121; }
        .sidebar { background: #fff; min-width: 220px; border-radius: 12px; box-shadow: 0 1px 5px rgba(0,0,0,0.06); padding: 1.5rem 0.5rem; }
        .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 12px 18px; color: #212121; text-decoration: none; border-radius: 8px; font-weight: 500; margin-bottom: 4px; transition: background 0.2s, border-left 0.2s; }
        .sidebar-item.active { border-left: 4px solid #212121; background: #f7f7f7; }
        .sidebar-item:hover { background: #f0f0f0; }
    </style>
</head>
<body>
    <header class="py-3 mb-4 border-bottom bg-white">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <a href="../index.html" class="navbar-brand d-flex align-items-center gap-2" style="color:#212121;font-size:2rem;font-weight:bold;text-decoration:none;">
                    <i class="bi bi-bag"></i> E-Commerce
                </a>
                <span class="greeting d-none d-md-inline">Xin chào, Seller 👋</span>
            </div>
            <div class="avatar-dropdown dropdown">
                <img src="../../assets/img/avatar-seller.jpg" class="avatar-img" data-bs-toggle="dropdown" alt="Seller">
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><span class="dropdown-item-text fw-bold">Seller</span></li>
                    <li><a class="dropdown-item" href="../profile.html"><i class="bi bi-person"></i> Hồ sơ</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#" onclick="auth.logout()"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a></li>
                </ul>
            </div>
        </div>
    </header>
    <main class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-lg-2 mb-4 mb-lg-0">
                <div class="sidebar">
                    <a href="../seller-dashboard.html" class="sidebar-item"><i class="bi bi-speedometer2"></i> Tổng quan</a>
                    <a href="products.html" class="sidebar-item"><i class="bi bi-box"></i> Sản phẩm</a>
                    <a href="orders.html" class="sidebar-item"><i class="bi bi-cart"></i> Đơn hàng</a>
                    <a href="reviews.html" class="sidebar-item active"><i class="bi bi-star"></i> Đánh giá</a>
                </div>
            </nav>
            <!-- Main Content -->
            <div class="col-lg-10">
                <h2 class="fw-bold mb-4">Đánh giá sản phẩm</h2>
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Sản phẩm</th>
                                        <th>Khách hàng</th>
                                        <th>Đánh giá</th>
                                        <th>Bình luận</th>
                                        <th>Thời gian</th>
                                    </tr>
                                </thead>
                                <tbody id="reviews-table">
                                    <!-- Đánh giá sẽ được load ở đây -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="py-3 mt-4 border-top bg-white">
        <div class="container text-center text-muted">
            <small>Copyright © 2024 E-Commerce Seller Dashboard. All rights reserved.</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../assets/js/main.js"></script>
    <script type="module" src="../../assets/js/seller-reviews.js"></script>
</body>
</html>
