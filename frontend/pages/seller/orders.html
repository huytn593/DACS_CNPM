<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="../../index.html">Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../../index.html">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../seller-dashboard.html">Quản lý bán hàng</a>
                    </li>
                </ul>
                <div id="auth-container"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3">
                <div class="list-group">
                    <a href="../seller-dashboard.html" class="list-group-item list-group-item-action">
                        <i class="bi bi-speedometer2"></i> Tổng quan
                    </a>
                    <a href="products.html" class="list-group-item list-group-item-action">
                        <i class="bi bi-box"></i> Sản phẩm
                    </a>
                    <a href="orders.html" class="list-group-item list-group-item-action active">
                        <i class="bi bi-cart"></i> Đơn hàng
                    </a>
                    <a href="reviews.html" class="list-group-item list-group-item-action">
                        <i class="bi bi-star"></i> Đánh giá
                    </a>
                </div>
            </div>

            <!-- Orders Content -->
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Quản lý đơn hàng</h2>
                    <div class="btn-group">
                        <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                            Lọc theo trạng thái
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" data-status="all">Tất cả</a></li>
                            <li><a class="dropdown-item" href="#" data-status="pending">Chờ xác nhận</a></li>
                            <li><a class="dropdown-item" href="#" data-status="confirmed">Đã xác nhận</a></li>
                            <li><a class="dropdown-item" href="#" data-status="shipping">Đang giao hàng</a></li>
                            <li><a class="dropdown-item" href="#" data-status="completed">Hoàn thành</a></li>
                            <li><a class="dropdown-item" href="#" data-status="cancelled">Đã hủy</a></li>
                        </ul>
                    </div>
                </div>

                <!-- Orders List -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Mã đơn</th>
                                        <th>Khách hàng</th>
                                        <th>Ngày đặt</th>
                                        <th>Tổng tiền</th>
                                        <th>Trạng thái</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="orders-table">
                                    <!-- Orders will be loaded here -->
                                </tbody>
                            </table>
            </div>
                </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Status Modal -->
    <div class="modal fade" id="orderStatusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cập nhật trạng thái đơn hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="order-status-form">
                        <input type="hidden" id="order-id">
                        <div class="mb-3">
                            <label class="form-label">Trạng thái</label>
                            <label for="order-status"></label>
                            <select class="form-select" id="order-status" required>
                                <option value="pending">Chờ xác nhận</option>
                                <option value="confirmed">Đã xác nhận</option>
                                <option value="shipping">Đang giao hàng</option>
                                <option value="completed">Hoàn thành</option>
                                <option value="cancelled">Đã hủy</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ghi chú</label>
                            <label for="order-note"></label>
                            <textarea class="form-control" id="order-note" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary" id="save-order-status">Lưu</button>
                    </div>
                                    </div>
                                </div>
                    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../assets/js/main.js"></script>
    <script type="module" src="../../assets/js/seller-orders.js"></script>
</body>
</html>
