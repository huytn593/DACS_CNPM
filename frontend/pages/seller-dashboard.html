<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý bán hàng</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,500,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background: #fff; color: #212121; }
        .sidebar {
            background: #fff;
            min-width: 220px;
            border-radius: 12px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.06);
            padding: 1.5rem 0.5rem;
        }
        .sidebar-item {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 18px; color: #212121; text-decoration: none;
            border-radius: 8px; font-weight: 500; margin-bottom: 4px;
            transition: background 0.2s, border-left 0.2s;
        }
        .sidebar-item.active {
            border-left: 4px solid #212121; background: #f7f7f7;
        }
        .sidebar-item:hover { background: #f0f0f0; }
        .dashboard-header { display: flex; align-items: center; justify-content: space-between; }
        .dashboard-header .greeting { font-size: 1.2rem; font-weight: 500; }
        .avatar-dropdown { display: flex; align-items: center; gap: 10px; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #eee; cursor: pointer; }
        .stat-card {
            border: 1px solid #eee; border-radius: 12px; box-shadow: 0 1px 5px rgba(0,0,0,0.08);
            background: #fff; padding: 1.5rem 1rem; display: flex; align-items: center; gap: 16px;
            margin-bottom: 1rem;
        }
        .stat-icon { font-size: 2.2rem; color: #36a2eb; }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-label { color: #888; font-size: 1rem; }
        .card-title { text-align: center; font-weight: 600; }
        .chart-card { border: 1px solid #eee; border-radius: 12px; box-shadow: 0 1px 5px rgba(0,0,0,0.08); background: #fff; }
        .chart-empty { text-align: center; color: #bbb; padding: 2rem 0; }
        @media (max-width: 991px) {
            .sidebar { min-width: 100%; margin-bottom: 1.5rem; }
        }
    </style>
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <header class="py-3 mb-4 border-bottom bg-white">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <a href="../index.html" class="navbar-brand d-flex align-items-center gap-2" style="color:#212121;font-size:2rem;font-weight:bold;text-decoration:none;">
                    <i class="bi bi-bag"></i> E-Commerce
                </a>
                <span class="greeting d-none d-md-inline">Xin chào, Seller 👋</span>
            </div>
            <div class="avatar-dropdown dropdown">
                <img src="../assets/img/avatar-seller.jpg" class="avatar-img" data-bs-toggle="dropdown" alt="Seller">
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><span class="dropdown-item-text fw-bold">Seller</span></li>
                    <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> Hồ sơ</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#" onclick="auth.logout()"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a></li>
                </ul>
            </div>
        </div>
    </header>
    <main class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-lg-2 mb-4 mb-lg-0">
                <div class="sidebar">
                    <a href="seller-dashboard.html" class="sidebar-item active"><i class="bi bi-speedometer2"></i> Tổng quan</a>
                    <a href="seller/products.html" class="sidebar-item"><i class="bi bi-box"></i> Sản phẩm</a>
                    <a href="seller/orders.html" class="sidebar-item"><i class="bi bi-cart"></i> Đơn hàng</a>
                    <a href="seller/reviews.html" class="sidebar-item"><i class="bi bi-star"></i> Đánh giá</a>
                </div>
            </nav>
            <!-- Dashboard Content -->
            <section class="col-lg-10">
                <div class="dashboard-header mb-4">
                    <h2 class="fw-bold">Tổng quan bán hàng</h2>
                </div>
                <!-- Statistics Cards -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <i class="bi bi-bag stat-icon"></i>
                            <div>
                                <div class="stat-value" id="total-orders">0</div>
                                <div class="stat-label">Tổng đơn hàng</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <i class="bi bi-cash-coin stat-icon"></i>
                            <div>
                                <div class="stat-value" id="total-revenue">0đ</div>
                                <div class="stat-label">Doanh thu</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <i class="bi bi-box stat-icon"></i>
                            <div>
                                <div class="stat-value" id="total-products">0</div>
                                <div class="stat-label">Sản phẩm</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <i class="bi bi-star stat-icon"></i>
                            <div>
                                <div class="stat-value" id="average-rating">0/5</div>
                                <div class="stat-label">Đánh giá</div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Charts -->
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="chart-card p-3">
                            <h5 class="card-title mb-3">Doanh thu theo tháng</h5>
                            <canvas id="revenue-chart" height="220"></canvas>
                            <div id="revenue-chart-empty" class="chart-empty" style="display:none;">Chưa có dữ liệu</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="chart-card p-3">
                            <h5 class="card-title mb-3">Đơn hàng theo trạng thái</h5>
                            <canvas id="orders-chart" height="220"></canvas>
                            <div id="orders-chart-empty" class="chart-empty" style="display:none;">Chưa có dữ liệu</div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/seller-dashboard.js"></script>
</body>
</html>
