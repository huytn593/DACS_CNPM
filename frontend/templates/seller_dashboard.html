<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#products">
                                Products
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#orders">
                                Orders
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#stats">
                                Statistics
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <!-- Products Section -->
                <div id="products" class="my-4">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Products</h1>
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">
                            Add New Product
                        </button>
                    </div>

                    <!-- Products Table -->
                    <div class="table-responsive">
                        <table class="table table-striped table-sm">
                            <thead>
                                <tr>
                                    <th scope="col">Name</th>
                                    <th scope="col">Category</th>
                                    <th scope="col">Price</th>
                                    <th scope="col">Stock</th>
                                    <th scope="col">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productsTable">
                                <!-- Products will be loaded here dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Orders Section -->
                <div id="orders" class="my-4">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Orders</h1>
                    </div>

                    <!-- Orders Table -->
                    <div class="table-responsive">
                        <table class="table table-striped table-sm">
                            <thead>
                                <tr>
                                    <th scope="col">Order ID</th>
                                    <th scope="col">Customer</th>
                                    <th scope="col">Date</th>
                                    <th scope="col">Total</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTable">
                                <!-- Orders will be loaded here dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Statistics Section -->
                <div id="stats" class="my-4">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Statistics</h1>
                    </div>

                    <div class="row">
                        <!-- Products Sold Chart -->
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header">
                                    Products Sold (Monthly)
                                </div>
                                <div class="card-body">
                                    <canvas id="productsSoldChart"></canvas>
                                </div>
                            </div>
                        </div>

                        <!-- Revenue Chart -->
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header">
                                    Revenue (Monthly)
                                </div>
                                <div class="card-body">
                                    <canvas id="revenueChart"></canvas>
                                </div>
                            </div>
                        </div>

                        <!-- Top Products Chart -->
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header">
                                    Top 5 Products
                                </div>
                                <div class="card-body">
                                    <canvas id="topProductsChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addProductModalLabel">Add New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm">
                        <div class="mb-3">
                            <label for="productName" class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="mb-3">
                            <label for="productDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="productDescription" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="productPrice" class="form-label">Price (VNĐ)</label>
                                <input type="number" class="form-control" id="productPrice" min="0" step="1000" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="productStock" class="form-label">Stock</label>
                                <input type="number" class="form-control" id="productStock" min="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="productCategory" class="form-label">Category</label>
                            <select class="form-select" id="productCategory" required>
                                <option value="">Select a category</option>
                                <option value="men-clothing">Men's Clothing</option>
                                <option value="women-clothing">Women's Clothing</option>
                                <option value="sneakers">Sneakers</option>
                                <option value="formal-shoes">Formal Shoes</option>
                                <option value="accessories">Accessories</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Available Sizes</label>
                            <div class="d-flex flex-wrap">
                                <div class="form-check me-3">
                                    <input class="form-check-input size-checkbox" type="checkbox" value="XS" id="sizeXS">
                                    <label class="form-check-label" for="sizeXS">XS</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input size-checkbox" type="checkbox" value="S" id="sizeS">
                                    <label class="form-check-label" for="sizeS">S</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input size-checkbox" type="checkbox" value="M" id="sizeM">
                                    <label class="form-check-label" for="sizeM">M</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input size-checkbox" type="checkbox" value="L" id="sizeL">
                                    <label class="form-check-label" for="sizeL">L</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input size-checkbox" type="checkbox" value="XL" id="sizeXL">
                                    <label class="form-check-label" for="sizeXL">XL</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input size-checkbox" type="checkbox" value="XXL" id="sizeXXL">
                                    <label class="form-check-label" for="sizeXXL">XXL</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Available Colors</label>
                            <div class="d-flex flex-wrap">
                                <div class="form-check me-3">
                                    <input class="form-check-input color-checkbox" type="checkbox" value="Red" id="colorRed">
                                    <label class="form-check-label" for="colorRed">Red</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input color-checkbox" type="checkbox" value="Blue" id="colorBlue">
                                    <label class="form-check-label" for="colorBlue">Blue</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input color-checkbox" type="checkbox" value="Black" id="colorBlack">
                                    <label class="form-check-label" for="colorBlack">Black</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input color-checkbox" type="checkbox" value="White" id="colorWhite">
                                    <label class="form-check-label" for="colorWhite">White</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input color-checkbox" type="checkbox" value="Green" id="colorGreen">
                                    <label class="form-check-label" for="colorGreen">Green</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input color-checkbox" type="checkbox" value="Yellow" id="colorYellow">
                                    <label class="form-check-label" for="colorYellow">Yellow</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveProductBtn">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Product Modal (Similar to Add Product Modal) -->
    <!-- ... -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/seller-dashboard.js"></script>
</body>
</html>
